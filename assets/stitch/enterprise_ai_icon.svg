<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    @keyframes radar-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes radar-sweep {
      0% { opacity: 0.8; }
      50% { opacity: 0.2; }
      100% { opacity: 0.8; }
    }
    @keyframes node-pulse {
      0%, 100% { transform: scale(1); fill: #ff00aa; }
      50% { transform: scale(1.3); fill: #00ffcc; }
    }
    @keyframes synapse-dash {
      to { stroke-dashoffset: -40; }
    }
    .radar-shield { transform-origin: 100px 100px; animation: radar-spin 6s linear infinite; }
    .radar-shield-fast { transform-origin: 100px 100px; animation: radar-spin 3s linear infinite reverse; }
    .node { transform-origin: center; animation: node-pulse 3s ease-in-out infinite; }
    .n2 { animation-delay: 0.5s; }
    .n3 { animation-delay: 1.0s; }
    .n4 { animation-delay: 1.5s; }
    .n5 { animation-delay: 2.0s; }
    .synapse { stroke-dasharray: 6 6; animation: synapse-dash 1s linear infinite; }
  </style>

  <rect width="200" height="200" fill="#030610" />

  <!-- Rotating Google Cloud Security Radar-Shield -->
  <g class="radar-shield">
    <circle cx="100" cy="100" r="85" fill="none" stroke="#00a8ff" stroke-width="4" stroke-dasharray="50 15 20 15 40 20" opacity="0.6" />
    <circle cx="100" cy="100" r="85" fill="none" stroke="#00ffcc" stroke-width="2" stroke-dasharray="50 15 20 15 40 20" />
    <!-- Radar Target Wedges -->
    <path d="M 100,100 L 100,15 A 85,85 0 0,1 160,40 Z" fill="#00ffcc" opacity="0.12" />
    <line x1="100" y1="100" x2="100" y2="15" stroke="#00ffcc" stroke-width="2" opacity="0.8" />
  </g>

  <g class="radar-shield-fast">
    <circle cx="100" cy="100" r="70" fill="none" stroke="#ff00aa" stroke-width="3" stroke-dasharray="30 40 10 30" opacity="0.7" />
    <circle cx="100" cy="30" r="3" fill="#ff2e2e" />
    <circle cx="170" cy="100" r="3" fill="#ff2e2e" />
  </g>

  <!-- Stationary Security Grid Core -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#00a8ff" stroke-width="1.5" opacity="0.4" />
  <circle cx="100" cy="100" r="30" fill="none" stroke="#00a8ff" stroke-width="1" opacity="0.3" />

  <!-- Highly Networked Neural Agent Synapse Cluster (6 Nodes) -->
  <!-- Synapse Lines -->
  <g stroke="#00a8ff" stroke-width="2.5" opacity="0.6">
    <line x1="100" y1="55" x2="60" y2="85" />
    <line x1="100" y1="55" x2="140" y2="85" />
    <line x1="60" y1="85" x2="75" y2="135" />
    <line x1="140" y1="85" x2="125" y2="135" />
    <line x1="75" y1="135" x2="125" y2="135" />
    <line x1="60" y1="85" x2="140" y2="85" />
    <line x1="100" y1="55" x2="100" y2="105" />
    <line x1="100" y1="105" x2="75" y2="135" />
    <line x1="100" y1="105" x2="125" y2="135" />
  </g>

  <!-- Animated Data Flow along Synapses -->
  <g stroke="#39ff14" stroke-width="2" fill="none" class="synapse">
    <line x1="100" y1="55" x2="140" y2="85" />
    <line x1="140" y1="85" x2="125" y2="135" />
    <line x1="75" y1="135" x2="60" y2="85" />
    <line x1="60" y1="85" x2="100" y2="55" />
    <line x1="100" y1="55" x2="100" y2="105" />
  </g>

  <!-- Neural Nodes with hard double stroke -->
  <!-- Node 1: Top -->
  <circle cx="100" cy="55" r="9" fill="#030610" stroke="#00ffcc" stroke-width="3" />
  <circle cx="100" cy="55" r="5" class="node" style="transform-origin: 100px 55px;" />

  <!-- Node 2: Left Upper -->
  <circle cx="60" cy="85" r="9" fill="#030610" stroke="#00ffcc" stroke-width="3" />
  <circle cx="60" cy="85" r="5" class="node n2" style="transform-origin: 60px 85px;" />

  <!-- Node 3: Right Upper -->
  <circle cx="140" cy="85" r="9" fill="#030610" stroke="#00ffcc" stroke-width="3" />
  <circle cx="140" cy="85" r="5" class="node n3" style="transform-origin: 140px 85px;" />

  <!-- Node 4: Left Lower -->
  <circle cx="75" cy="135" r="9" fill="#030610" stroke="#00ffcc" stroke-width="3" />
  <circle cx="75" cy="135" r="5" class="node n4" style="transform-origin: 75px 135px;" />

  <!-- Node 5: Right Lower -->
  <circle cx="125" cy="135" r="9" fill="#030610" stroke="#00ffcc" stroke-width="3" />
  <circle cx="125" cy="135" r="5" class="node n5" style="transform-origin: 125px 135px;" />

  <!-- Node 6: Center Hub -->
  <circle cx="100" cy="105" r="11" fill="#030610" stroke="#ffd700" stroke-width="3" />
  <circle cx="100" cy="105" r="6" fill="#39ff14" class="node n2" style="transform-origin: 100px 105px;" />

  <!-- Security Corner Lock Indicators -->
  <polygon points="10,10 25,10 10,25" fill="#ff00aa" />
  <polygon points="190,10 175,10 190,25" fill="#00ffcc" />
  <polygon points="10,190 25,190 10,175" fill="#00ffcc" />
  <polygon points="190,190 175,190 190,175" fill="#ff00aa" />
</svg>
