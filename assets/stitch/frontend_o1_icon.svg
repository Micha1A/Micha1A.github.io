<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .bg { fill: #030610; }
    .grid-line { stroke: #00a8ff; stroke-width: 1; stroke-opacity: 0.15; }
    .grid-group { transform-origin: 100px 100px; animation: grid-shift 4s infinite alternate ease-in-out; }
    .loop-glow { stroke: #ff00aa; stroke-width: 12; fill: none; stroke-linecap: round; opacity: 0.4; transform-origin: 100px 100px; animation: loop-breathe 2s infinite alternate; }
    .loop-main { stroke: #00ffcc; stroke-width: 6; fill: none; stroke-linecap: round; stroke-dasharray: 40 20; animation: constant-flow 2s infinite linear; }
    .loop-core { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 10 10; animation: constant-flow 1s infinite linear; }
    .node-gold { fill: #ffd700; stroke: #ffffff; stroke-width: 1.5; transform-origin: 100px 100px; animation: pulse 1s infinite alternate; }

    @keyframes grid-shift { 0% { transform: scale(0.95) rotate(-2deg); } 100% { transform: scale(1.05) rotate(2deg); } }
    @keyframes constant-flow { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
    @keyframes loop-breathe { 0% { transform: scale(0.96); stroke: #ff00aa; } 100% { transform: scale(1.04); stroke: #39ff14; } }
    @keyframes pulse { 0% { transform: scale(0.7); opacity: 0.8; } 100% { transform: scale(1.3); opacity: 1; } }
  </style>
  <rect class="bg" width="200" height="200" rx="20" />

  <!-- Animated Cyber-Grid -->
  <g class="grid-group">
    <line class="grid-line" x1="20" y1="40" x2="180" y2="40" />
    <line class="grid-line" x1="20" y1="70" x2="180" y2="70" />
    <line class="grid-line" x1="20" y1="100" x2="180" y2="100" />
    <line class="grid-line" x1="20" y1="130" x2="180" y2="130" />
    <line class="grid-line" x1="20" y1="160" x2="180" y2="160" />
    
    <line class="grid-line" x1="40" y1="20" x2="40" y2="180" />
    <line class="grid-line" x1="70" y1="20" x2="70" y2="180" />
    <line class="grid-line" x1="100" y1="20" x2="100" y2="180" />
    <line class="grid-line" x1="130" y1="20" x2="130" y2="180" />
    <line class="grid-line" x1="160" y1="20" x2="160" y2="180" />
    
    <!-- Diagonal grid accents -->
    <line class="grid-line" x1="20" y1="20" x2="180" y2="180" stroke-dasharray="4 8" />
    <line class="grid-line" x1="180" y1="20" x2="20" y2="180" stroke-dasharray="4 8" />
  </g>

  <!-- Glowing O(1) Infinity Lemniskate Loop -->
  <path class="loop-glow" d="M 100 100 C 75 65, 25 65, 25 100 C 25 135, 75 135, 100 100 C 125 65, 175 65, 175 100 C 175 135, 125 135, 100 100 Z" />
  <path class="loop-main" d="M 100 100 C 75 65, 25 65, 25 100 C 25 135, 75 135, 100 100 C 125 65, 175 65, 175 100 C 175 135, 125 135, 100 100 Z" />
  <path class="loop-core" d="M 100 100 C 75 65, 25 65, 25 100 C 25 135, 75 135, 100 100 C 125 65, 175 65, 175 100 C 175 135, 125 135, 100 100 Z" />

  <!-- Focal points of constant runtime -->
  <circle class="node-gold" cx="50" cy="100" r="6" />
  <circle class="node-gold" style="animation-delay: -0.5s;" cx="150" cy="100" r="6" />
  <circle cx="100" cy="100" r="5" fill="#ffffff" />
</svg>
