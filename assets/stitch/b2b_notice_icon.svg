<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    @keyframes globe-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbit-dash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes beacon-blink {
      0%, 100% { fill: #ff00aa; transform: scale(1); }
      50% { fill: #ffffff; transform: scale(1.6); }
    }
    @keyframes beacon-gold {
      0%, 100% { fill: #ffd700; transform: scale(1); }
      50% { fill: #39ff14; transform: scale(1.5); }
    }
    .grid-rotate { transform-origin: 100px 100px; animation: globe-spin 20s linear infinite; }
    .orbit-1 { transform-origin: 100px 100px; animation: globe-spin 8s linear infinite; }
    .orbit-2 { transform-origin: 100px 100px; animation: globe-spin 12s linear infinite reverse; }
    .orbit-lines { stroke-dasharray: 12 18; animation: orbit-dash 2s linear infinite; }
    .beacon-1 { transform-origin: center; animation: beacon-blink 2s infinite ease-in-out; }
    .beacon-2 { transform-origin: center; animation: beacon-gold 3s infinite ease-in-out 1s; }
  </style>

  <rect width="200" height="200" fill="#030610" />

  <!-- Outer Deep Space Grid Accents -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#00a8ff" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />
  
  <!-- Orbital Satellite Trajectories -->
  <g class="orbit-1">
    <ellipse cx="100" cy="100" rx="90" ry="40" fill="none" stroke="#ff00aa" stroke-width="3" opacity="0.3" transform="rotate(25 100 100)" />
    <ellipse cx="100" cy="100" rx="90" ry="40" fill="none" stroke="#ff00aa" stroke-width="2" class="orbit-lines" transform="rotate(25 100 100)" />
    <!-- Satellite Node -->
    <circle cx="185" cy="80" r="6" fill="#030610" stroke="#ff00aa" stroke-width="3" />
    <circle cx="185" cy="80" r="3" class="beacon-1" style="transform-origin: 185px 80px;" />
  </g>

  <g class="orbit-2">
    <ellipse cx="100" cy="100" rx="85" ry="35" fill="none" stroke="#00ffcc" stroke-width="3" opacity="0.3" transform="rotate(-35 100 100)" />
    <ellipse cx="100" cy="100" rx="85" ry="35" fill="none" stroke="#00ffcc" stroke-width="1.5" class="orbit-lines" transform="rotate(-35 100 100)" />
    <!-- Satellite Node 2 -->
    <circle cx="20" cy="135" r="7" fill="#030610" stroke="#ffd700" stroke-width="3" />
    <circle cx="20" cy="135" r="3.5" class="beacon-2" style="transform-origin: 20px 135px;" />
  </g>

  <!-- Rotating Wireframe Global Grid Sphere (Center Core) -->
  <g class="grid-rotate">
    <!-- Outer boundary of sphere -->
    <circle cx="100" cy="100" r="55" fill="#030610" stroke="#00a8ff" stroke-width="4" />
    <circle cx="100" cy="100" r="55" fill="none" stroke="#00ffcc" stroke-width="2" />
    
    <!-- Longitude lines -->
    <ellipse cx="100" cy="100" rx="40" ry="55" fill="none" stroke="#00a8ff" stroke-width="1.5" />
    <ellipse cx="100" cy="100" rx="20" ry="55" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-dasharray="6 4" />
    <line x1="100" y1="45" x2="100" y2="155" stroke="#00ffcc" stroke-width="2" />

    <!-- Latitude lines -->
    <ellipse cx="100" cy="100" rx="55" ry="40" fill="none" stroke="#00a8ff" stroke-width="1.5" />
    <ellipse cx="100" cy="100" rx="55" ry="20" fill="none" stroke="#00ffcc" stroke-width="1.5" stroke-dasharray="6 4" />
    <line x1="45" y1="100" x2="155" y2="100" stroke="#00ffcc" stroke-width="2" />
  </g>

  <!-- Surface B2B Beacon Nodes -->
  <circle cx="80" cy="75" r="5" fill="#39ff14" class="beacon-2" style="transform-origin: 80px 75px;" />
  <circle cx="130" cy="115" r="5" fill="#ff00aa" class="beacon-1" style="transform-origin: 130px 115px;" />
  <circle cx="110" cy="70" r="4" fill="#ffd700" class="beacon-2" style="transform-origin: 110px 70px; animation-delay: 0.5s;" />

  <!-- Futuristic Telecom Corner Markers -->
  <path d="M 10,10 L 30,10 L 30,30" fill="none" stroke="#00ffcc" stroke-width="2.5" />
  <path d="M 190,10 L 170,10 L 170,30" fill="none" stroke="#ff00aa" stroke-width="2.5" />
  <path d="M 10,190 L 30,190 L 30,170" fill="none" stroke="#ffd700" stroke-width="2.5" />
  <path d="M 190,190 L 170,190 L 170,170" fill="none" stroke="#00ffcc" stroke-width="2.5" />
</svg>
