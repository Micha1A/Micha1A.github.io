<!-- [2026-08-01] [SVG, Stitch, Frontend, O(1)] - Organized by Gemini -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .chip { fill: #030610; stroke: #ff00aa; stroke-width: 3; }
    .pin { stroke: #00ffcc; stroke-width: 4; }
    .wave { stroke: #00ffcc; stroke-width: 2; fill: transparent; animation: wave-anim 1s infinite alternate; }
    @keyframes wave-anim { 0% { transform: scaleY(0.5); } 100% { transform: scaleY(1.5); } }
  </style>
  <rect x="50" y="50" width="100" height="100" class="chip" rx="10" />
  <!-- Pins top -->
  <line x1="70" y1="30" x2="70" y2="50" class="pin" />
  <line x1="100" y1="30" x2="100" y2="50" class="pin" />
  <line x1="130" y1="30" x2="130" y2="50" class="pin" />
  <!-- Pins bottom -->
  <line x1="70" y1="150" x2="70" y2="170" class="pin" />
  <line x1="100" y1="150" x2="100" y2="170" class="pin" />
  <line x1="130" y1="150" x2="130" y2="170" class="pin" />
  <!-- Pins left -->
  <line x1="30" y1="70" x2="50" y2="70" class="pin" />
  <line x1="30" y1="100" x2="50" y2="100" class="pin" />
  <line x1="30" y1="130" x2="50" y2="130" class="pin" />
  <!-- Pins right -->
  <line x1="150" y1="70" x2="170" y2="70" class="pin" />
  <line x1="150" y1="100" x2="170" y2="100" class="pin" />
  <line x1="150" y1="130" x2="170" y2="130" class="pin" />
  <!-- Audio wave in middle -->
  <g transform="translate(100, 100)">
    <line x1="-20" y1="-10" x2="-20" y2="10" class="wave" style="animation-delay: 0.1s;" />
    <line x1="-10" y1="-20" x2="-10" y2="20" class="wave" style="animation-delay: 0.2s;" />
    <line x1="0" y1="-30" x2="0" y2="30" class="wave" style="animation-delay: 0.3s;" />
    <line x1="10" y1="-20" x2="10" y2="20" class="wave" style="animation-delay: 0.4s;" />
    <line x1="20" y1="-10" x2="20" y2="10" class="wave" style="animation-delay: 0.5s;" />
  </g>
</svg>
