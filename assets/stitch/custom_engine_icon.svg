<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .bg { fill: #030610; }
    .gear-outer { stroke: #00ffcc; stroke-width: 14; stroke-dasharray: 12 12; fill: none; transform-origin: 100px 100px; animation: rotate-cw 6s infinite linear; }
    .gear-inner { stroke: #ff00aa; stroke-width: 12; stroke-dasharray: 9 9; fill: none; transform-origin: 100px 100px; animation: rotate-ccw 4s infinite linear; }
    .turbine-core { fill: #ffd700; stroke: #ffffff; stroke-width: 2; transform-origin: 100px 100px; animation: pulse-core 0.5s infinite alternate; }
    .energy-beam { stroke: #00ffcc; stroke-width: 3; stroke-linecap: round; transform-origin: 100px 100px; animation: beam-pulse 1s infinite linear; }
    .beam-core { stroke: #ffffff; stroke-width: 1; transform-origin: 100px 100px; animation: beam-pulse 1s infinite linear; }
    .ring-border { stroke: #00a8ff; stroke-width: 2; fill: none; opacity: 0.7; }

    @keyframes rotate-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes rotate-ccw { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
    @keyframes pulse-core { 0% { transform: scale(0.92); fill: #ffd700; } 100% { transform: scale(1.08); fill: #39ff14; } }
    @keyframes beam-pulse { 
      0% { stroke-dasharray: 5 40; stroke-dashoffset: 0; opacity: 1; } 
      100% { stroke-dasharray: 20 25; stroke-dashoffset: -45; opacity: 0.4; } 
    }
  </style>
  <rect class="bg" width="200" height="200" rx="20" />
  
  <circle class="ring-border" cx="100" cy="100" r="86" />
  <circle class="ring-border" cx="100" cy="100" r="48" stroke-dasharray="4 4" />

  <!-- Radiating Energy Beams -->
  <g>
    <line class="energy-beam" x1="100" y1="100" x2="100" y2="10" />
    <line class="energy-beam" x1="100" y1="100" x2="164" y2="36" />
    <line class="energy-beam" x1="100" y1="100" x2="190" y2="100" />
    <line class="energy-beam" x1="100" y1="100" x2="164" y2="164" />
    <line class="energy-beam" x1="100" y1="100" x2="100" y2="190" />
    <line class="energy-beam" x1="100" y1="100" x2="36" y2="164" />
    <line class="energy-beam" x1="100" y1="100" x2="10" y2="100" />
    <line class="energy-beam" x1="100" y1="100" x2="36" y2="36" />
    
    <!-- White core rays -->
    <line class="beam-core" x1="100" y1="100" x2="100" y2="10" />
    <line class="beam-core" x1="100" y1="100" x2="190" y2="100" />
    <line class="beam-core" x1="100" y1="100" x2="100" y2="190" />
    <line class="beam-core" x1="100" y1="100" x2="10" y2="100" />
  </g>

  <!-- Outer Quantum Gear -->
  <circle class="gear-outer" cx="100" cy="100" r="68" />
  <circle cx="100" cy="100" r="61" stroke="#ffffff" stroke-width="1.5" fill="none" />
  <circle cx="100" cy="100" r="75" stroke="#00ffcc" stroke-width="1" fill="none" />

  <!-- Inner Counter-Rotating Gear -->
  <circle class="gear-inner" cx="100" cy="100" r="38" />
  <circle cx="100" cy="100" r="32" stroke="#ffffff" stroke-width="1.5" fill="none" />

  <!-- Turbine Core -->
  <polygon class="turbine-core" points="100,82 115,92 115,108 100,118 85,108 85,92" />
  <circle cx="100" cy="100" r="6" fill="#030610" />
</svg>
