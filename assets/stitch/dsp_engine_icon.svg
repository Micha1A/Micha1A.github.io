<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes signal-flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes node-blink {
      0%, 40%, 100% { fill: #030610; stroke: #00a8ff; }
      20% { fill: #ff00aa; stroke: #ff00aa; }
      60% { fill: #00ffcc; stroke: #00ffcc; }
    }
    .node-center { transform-origin: center; animation: node-blink 4s infinite ease-in-out; }
    .node-1 { animation-delay: 0s; }
    .node-2 { animation-delay: 0.8s; }
    .node-3 { animation-delay: 1.6s; }
    .node-4 { animation-delay: 2.4s; }
    .node-5 { animation-delay: 3.2s; }
    .fiber-core { stroke-dasharray: 8 12; animation: signal-flow 1.5s linear infinite; }
    .fiber-core-fast { stroke-dasharray: 12 8; animation: signal-flow 0.8s linear infinite reverse; }
    .pulse-ring { transform-origin: center; animation: pulse-fast 2s infinite ease-in-out; }
  </style>
  
  <rect x="10" y="10" width="180" height="180" rx="15" fill="#030610" stroke="#00a8ff" stroke-width="4" />
  <rect x="14" y="14" width="172" height="172" rx="11" fill="none" stroke="#00ffcc" stroke-width="1.5" opacity="0.5" />
  
  <!-- Grid of Jacks / Matrix Nodes -->
  <!-- Row 1 -->
  <circle cx="50" cy="50" r="14" fill="#030610" stroke="#00a8ff" stroke-width="3" />
  <circle cx="50" cy="50" r="8" class="node-center node-1" stroke-width="2" />
  <circle cx="50" cy="50" r="18" fill="none" stroke="#ff00aa" stroke-width="1.5" class="pulse-ring" style="transform-origin: 50px 50px;" />

  <circle cx="100" cy="50" r="14" fill="#030610" stroke="#00a8ff" stroke-width="3" />
  <circle cx="100" cy="50" r="8" class="node-center node-2" stroke-width="2" />

  <circle cx="150" cy="50" r="14" fill="#030610" stroke="#00a8ff" stroke-width="3" />
  <circle cx="150" cy="50" r="8" class="node-center node-3" stroke-width="2" />
  <circle cx="150" cy="50" r="18" fill="none" stroke="#00ffcc" stroke-width="1.5" class="pulse-ring" style="transform-origin: 150px 50px; animation-delay: 0.5s;" />

  <!-- Row 2 -->
  <circle cx="50" cy="100" r="14" fill="#030610" stroke="#00a8ff" stroke-width="3" />
  <circle cx="50" cy="100" r="8" class="node-center node-4" stroke-width="2" />

  <circle cx="100" cy="100" r="16" fill="#030610" stroke="#ffd700" stroke-width="4" />
  <circle cx="100" cy="100" r="9" class="node-center node-5" stroke-width="2" />
  <circle cx="100" cy="100" r="22" fill="none" stroke="#ffd700" stroke-width="2" class="pulse-ring" style="transform-origin: 100px 100px; animation-delay: 1s;" />

  <circle cx="150" cy="100" r="14" fill="#030610" stroke="#00a8ff" stroke-width="3" />
  <circle cx="150" cy="100" r="8" class="node-center node-1" stroke-width="2" />

  <!-- Row 3 -->
  <circle cx="50" cy="150" r="14" fill="#030610" stroke="#00a8ff" stroke-width="3" />
  <circle cx="50" cy="150" r="8" class="node-center node-2" stroke-width="2" />

  <circle cx="100" cy="150" r="14" fill="#030610" stroke="#00a8ff" stroke-width="3" />
  <circle cx="100" cy="150" r="8" class="node-center node-3" stroke-width="2" />

  <circle cx="150" cy="150" r="14" fill="#030610" stroke="#00a8ff" stroke-width="3" />
  <circle cx="150" cy="150" r="8" class="node-center node-4" stroke-width="2" />
  <circle cx="150" cy="150" r="18" fill="none" stroke="#ff00aa" stroke-width="1.5" class="pulse-ring" style="transform-origin: 150px 150px; animation-delay: 1.5s;" />

  <!-- LWL Fiber Optic Connections (Double strokes for VRAM-friendly glow without blur) -->
  <!-- Cable 1: (50,50) to (150,150) -->
  <path d="M 50,50 C 90,20 120,110 150,150" fill="none" stroke="#ff00aa" stroke-width="5" stroke-linecap="round" opacity="0.4" />
  <path d="M 50,50 C 90,20 120,110 150,150" fill="none" stroke="#ff00aa" stroke-width="3" stroke-linecap="round" />
  <path d="M 50,50 C 90,20 120,110 150,150" fill="none" stroke="#ffffff" stroke-width="1.5" class="fiber-core" />

  <!-- Cable 2: (150,50) to (50,150) -->
  <path d="M 150,50 C 180,90 100,120 50,150" fill="none" stroke="#00a8ff" stroke-width="5" stroke-linecap="round" opacity="0.4" />
  <path d="M 150,50 C 180,90 100,120 50,150" fill="none" stroke="#00a8ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 150,50 C 180,90 100,120 50,150" fill="none" stroke="#00ffcc" stroke-width="1.5" class="fiber-core-fast" />

  <!-- Cable 3: (100,50) to (100,100) to (150,100) -->
  <path d="M 100,50 Q 70,80 100,100 T 150,100" fill="none" stroke="#39ff14" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <path d="M 100,50 Q 70,80 100,100 T 150,100" fill="none" stroke="#39ff14" stroke-width="2" stroke-linecap="round" />
  <path d="M 100,50 Q 70,80 100,100 T 150,100" fill="none" stroke="#ffffff" stroke-width="1.2" class="fiber-core" />

  <!-- Decorative Corner Brackets for O(1) Bare Metal Vibe -->
  <path d="M 20,40 L 20,20 L 40,20" fill="none" stroke="#00ffcc" stroke-width="3" />
  <path d="M 160,20 L 180,20 L 180,40" fill="none" stroke="#00ffcc" stroke-width="3" />
  <path d="M 20,160 L 20,180 L 40,180" fill="none" stroke="#00ffcc" stroke-width="3" />
  <path d="M 160,180 L 180,180 L 180,160" fill="none" stroke="#00ffcc" stroke-width="3" />
</svg>
