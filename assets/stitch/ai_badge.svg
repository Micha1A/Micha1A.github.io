<!-- [2026-08-01] [SVG, Stitch, Frontend, O(1)] - Organized by Gemini -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .bg { fill: #030610; stroke: #00ffcc; stroke-width: 2; }
    .node { fill: #00ffcc; animation: pulse 2s infinite alternate; }
    .connection { stroke: #ff00aa; stroke-width: 2; animation: flow 3s linear infinite; stroke-dasharray: 10 5; }
    @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.1); } }
    @keyframes flow { 0% { stroke-dashoffset: 15; } 100% { stroke-dashoffset: 0; } }
  </style>
  <polygon points="100,20 180,60 180,140 100,180 20,140 20,60" class="bg" />
  <line x1="100" y1="50" x2="150" y2="100" class="connection" />
  <line x1="100" y1="50" x2="50" y2="100" class="connection" />
  <line x1="50" y1="100" x2="100" y2="150" class="connection" />
  <line x1="150" y1="100" x2="100" y2="150" class="connection" />
  <circle cx="100" cy="50" r="8" class="node" />
  <circle cx="150" cy="100" r="8" class="node" style="animation-delay: 0.3s;" />
  <circle cx="50" cy="100" r="8" class="node" style="animation-delay: 0.6s;" />
  <circle cx="100" cy="150" r="8" class="node" style="animation-delay: 0.9s;" />
  <circle cx="100" cy="100" r="12" class="node" style="animation-duration: 1.5s; fill: #ff00aa;" />
</svg>
