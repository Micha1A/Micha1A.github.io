<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <style>
        .wave {
            fill: none;
            stroke-width: 2;
            opacity: 0;
            transform-origin: center;
        }
        .wave-right-1 { stroke: #00ffcc; animation: rippleR 3.2s linear infinite; }
        .wave-right-2 { stroke: #ff00aa; animation: rippleR 3.2s linear infinite 1.06s; }
        .wave-right-3 { stroke: #00a8ff; animation: rippleR 3.2s linear infinite 2.13s; }
        
        .bongo-body {
            fill: none;
            stroke: #00ffcc;
            stroke-width: 4;
        }
        .bongo-skin {
            fill: none;
            stroke: #ffd700;
            stroke-width: 2;
            animation: hitR 1.6s ease-in-out infinite;
            transform-origin: 100px 80px;
        }
        
        .feynman-line {
            fill: none;
            stroke: #ff2e2e;
            stroke-width: 2;
            stroke-dasharray: 6 3;
            animation: dashR 4.2s linear infinite reverse;
        }
        
        .core {
            fill: #030610;
            stroke: #39ff14;
            stroke-width: 2;
        }

        @keyframes rippleR {
            0% { r: 35px; opacity: 1; stroke-width: 4; }
            100% { r: 95px; opacity: 0; stroke-width: 1; }
        }
        
        @keyframes hitR {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.08) scaleX(0.98); }
        }
        
        @keyframes dashR {
            to { stroke-dashoffset: -27; }
        }
    </style>
    
    <!-- Quantum Waves -->
    <circle cx="100" cy="80" r="35" class="wave wave-right-1" />
    <circle cx="100" cy="80" r="35" class="wave wave-right-2" />
    <circle cx="100" cy="80" r="35" class="wave wave-right-3" />
    
    <!-- Feynman Diagram Elements -->
    <path d="M30 150 Q 80 130 100 80" class="feynman-line" />
    <path d="M170 150 Q 120 130 100 80" class="feynman-line" />
    
    <!-- Bongo Body -->
    <path d="M65 80 L60 145 Q 100 165 140 145 L135 80" class="bongo-body" />
    <path d="M60 80 L55 145 Q 100 170 145 145 L140 80" class="bongo-body" stroke-width="2" opacity="0.5" />
    
    <!-- Bongo Skin (Drumhead) -->
    <ellipse cx="100" cy="80" rx="38" ry="16" class="core" />
    <ellipse cx="100" cy="80" rx="38" ry="16" class="bongo-skin" />
    
    <!-- Inner Rings -->
    <ellipse cx="100" cy="80" rx="18" ry="7" class="bongo-skin" style="stroke:#00a8ff; animation-delay: 0.3s" />
</svg>
