<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-ccw {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes target-lock {
      0%, 100% { transform: scale(1); opacity: 0.8; stroke: #ff00aa; }
      50% { transform: scale(0.92); opacity: 1; stroke: #ff2e2e; }
    }
    @keyframes center-blink {
      0%, 85%, 100% { fill: #ff2e2e; transform: scale(1); }
      90%, 95% { fill: #00ffcc; transform: scale(1.5); }
    }
    @keyframes bracket-clamp {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.95); }
    }
    .rot-fast { transform-origin: 100px 100px; animation: spin-cw 4s linear infinite; }
    .rot-slow { transform-origin: 100px 100px; animation: spin-ccw 8s linear infinite; }
    .rot-outer { transform-origin: 100px 100px; animation: spin-cw 12s linear infinite; }
    .lock { transform-origin: 100px 100px; animation: target-lock 1.5s infinite ease-in-out; }
    .center-dot { transform-origin: center; animation: center-blink 3s infinite; }
    .clamp { transform-origin: 100px 100px; animation: bracket-clamp 1.5s infinite ease-in-out; }
  </style>

  <rect width="200" height="200" fill="#030610" />

  <!-- Outer HUD Targeting Brackets (Locking animation) -->
  <g class="clamp" stroke="#00ffcc" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 30,60 L 30,30 L 60,30" />
    <path d="M 140,30 L 170,30 L 170,60" />
    <path d="M 30,140 L 30,170 L 60,170" />
    <path d="M 140,170 L 170,170 L 170,140" />
  </g>
  
  <!-- Double Stroke Inner Cyan Glow for VRAM O(1) performance -->
  <g class="clamp" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 32,58 L 32,32 L 58,32" />
    <path d="M 142,32 L 168,32 L 168,58" />
    <path d="M 32,142 L 32,168 L 58,168" />
    <path d="M 142,168 L 168,168 L 168,142" />
  </g>

  <!-- Outer Circling Segmented Ring -->
  <g class="rot-outer">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#00a8ff" stroke-width="3" stroke-dasharray="40 20 15 20 60 20 10 15" />
    <circle cx="100" cy="100" r="80" fill="none" stroke="#00ffcc" stroke-width="1" stroke-dasharray="40 20 15 20 60 20 10 15" />
  </g>

  <!-- Counter-Rotating Middle Sniper Ring -->
  <g class="rot-slow">
    <circle cx="100" cy="100" r="60" fill="none" stroke="#ff00aa" stroke-width="4" stroke-dasharray="25 35 30 35" class="lock" />
    <!-- Ticks on middle ring -->
    <line x1="100" y1="35" x2="100" y2="45" stroke="#00ffcc" stroke-width="3" />
    <line x1="100" y1="155" x2="100" y2="165" stroke="#00ffcc" stroke-width="3" />
    <line x1="35" y1="100" x2="45" y2="100" stroke="#00ffcc" stroke-width="3" />
    <line x1="155" y1="100" x2="165" y2="100" stroke="#00ffcc" stroke-width="3" />
  </g>

  <!-- High Speed Inner Lock Ring -->
  <g class="rot-fast">
    <circle cx="100" cy="100" r="38" fill="none" stroke="#00ffcc" stroke-width="2.5" stroke-dasharray="15 15 8 15" />
    <!-- Radar lock triangle pointers -->
    <polygon points="100,58 95,50 105,50" fill="#ff2e2e" />
    <polygon points="100,142 95,150 105,150" fill="#ff2e2e" />
  </g>

  <!-- Precision Crosshairs -->
  <g stroke="#00ffcc" stroke-width="1.5" opacity="0.7">
    <line x1="10" y1="100" x2="75" y2="100" />
    <line x1="125" y1="100" x2="190" y2="100" />
    <line x1="100" y1="10" x2="100" y2="75" />
    <line x1="100" y1="125" x2="100" y2="190" />
    
    <!-- Fine ranging ticks -->
    <line x1="60" y1="96" x2="60" y2="104" stroke-width="2" />
    <line x1="70" y1="97" x2="70" y2="103" stroke-width="2" />
    <line x1="140" y1="96" x2="140" y2="104" stroke-width="2" />
    <line x1="130" y1="97" x2="130" y2="103" stroke-width="2" />
  </g>

  <!-- Center Target Lock Point -->
  <circle cx="100" cy="100" r="18" fill="none" stroke="#ff00aa" stroke-width="2" opacity="0.5" />
  <circle cx="100" cy="100" r="5" fill="#ff2e2e" class="center-dot" style="transform-origin: 100px 100px;" />
  <circle cx="100" cy="100" r="2" fill="#ffffff" />
</svg>
