<!-- [2026-08-04] [SVG, Stitch-Bro, O(1), Animated Icon] - Organized by Gemini -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .bg { fill: #030610; }
    .core { fill: #00ffcc; transform-origin: 100px 100px; animation: pulse 2s infinite ease-in-out; }
    .core-ring { stroke: #ffffff; stroke-width: 2; fill: none; transform-origin: 100px 100px; animation: ripple 3s infinite linear; }
    .ring-40 { stroke: #00ffcc; stroke-width: 6; fill: none; stroke-linecap: round; transform-origin: 100px 100px; animation: rot-cw 8s infinite linear; }
    .ring-40-glow { stroke: #00ffcc; stroke-width: 2; stroke-opacity: 0.5; fill: none; transform-origin: 100px 100px; animation: rot-cw 8s infinite linear; }
    .ring-30-a { stroke: #ff00aa; stroke-width: 6; fill: none; stroke-linecap: round; transform-origin: 100px 100px; animation: rot-ccw 6s infinite linear; }
    .ring-30-b { stroke: #ffd700; stroke-width: 6; fill: none; stroke-linecap: round; transform-origin: 100px 100px; animation: rot-cw 10s infinite linear; }
    .grid-line { stroke: #00a8ff; stroke-width: 1; stroke-opacity: 0.2; }
    
    @keyframes rot-cw { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes rot-ccw { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(0.85); opacity: 0.8; } 50% { transform: scale(1.15); opacity: 1; } }
    @keyframes ripple { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
  </style>
  <rect class="bg" width="200" height="200" rx="20" />
  
  <g>
    <circle class="grid-line" cx="100" cy="100" r="80" />
    <circle class="grid-line" cx="100" cy="100" r="60" />
    <circle class="grid-line" cx="100" cy="100" r="40" />
    <line class="grid-line" x1="20" y1="100" x2="180" y2="100" />
    <line class="grid-line" x1="100" y1="20" x2="100" y2="180" />
  </g>

  <circle class="core-ring" cx="100" cy="100" r="25" />
  <circle class="core-ring" style="animation-delay: -1.5s;" cx="100" cy="100" r="25" />
  <circle class="core" cx="100" cy="100" r="14" />
  <circle cx="100" cy="100" r="6" fill="#030610" />

  <!-- 40% Segment (Outer, R=75, C=471 -> 40% is ~188) -->
  <circle class="ring-40-glow" cx="100" cy="100" r="78" stroke-dasharray="188 283" />
  <circle class="ring-40" cx="100" cy="100" r="75" stroke-dasharray="188 283" />
  <circle cx="100" cy="100" r="75" stroke="#ffffff" stroke-width="1" fill="none" stroke-dasharray="188 283" transform-origin="100px 100px" style="animation: rot-cw 8s infinite linear;" />

  <!-- 30% Segment (Middle, R=55, C=345 -> 30% is ~103) -->
  <circle class="ring-30-a" cx="100" cy="100" r="55" stroke-dasharray="103 242" />
  <circle cx="100" cy="100" r="55" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-dasharray="103 242" transform-origin="100px 100px" style="animation: rot-ccw 6s infinite linear;" />

  <!-- 30% Segment (Inner, R=35, C=220 -> 30% is ~66) -->
  <circle class="ring-30-b" cx="100" cy="100" r="35" stroke-dasharray="66 154" />
  <circle cx="100" cy="100" r="35" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-dasharray="66 154" transform-origin="100px 100px" style="animation: rot-cw 10s infinite linear;" />
</svg>
